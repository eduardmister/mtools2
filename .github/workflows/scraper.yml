name: Scraper FutbolFantasy
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: scraper
        run: npm install
      - name: Ejecutar el scraper
        working-directory: scraper
        run: node scrape.js
      - name: Publicar JSON en la raiz
        run: |
          cp scraper/externo.json ./externo.json
          if [ -f scraper/clasificacion.json ]; then cp scraper/clasificacion.json ./clasificacion.json; fi
      - name: Commit del resultado
        run: |
          git config user.name "mistertools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add externo.json clasificacion.json 2>/dev/null || git add externo.json
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualiza externo.json y clasificacion.json"
          # Reintentar el push integrando cambios remotos (evita el rechazo fetch-first)
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Reintento $i tras conflicto de push..."
            sleep 3
          done
