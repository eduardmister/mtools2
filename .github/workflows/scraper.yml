name: Scraper FutbolFantasy
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: scraper
        run: npm install
      - name: Ejecutar el scraper
        working-directory: scraper
        run: node scrape.js
      - name: Publicar externo.json en la raiz
        run: cp scraper/externo.json ./externo.json
      - name: Commit del resultado
        run: |
          git config user.name "mistertools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add externo.json
          git diff --staged --quiet || git commit -m "Actualiza externo.json"
          git push
